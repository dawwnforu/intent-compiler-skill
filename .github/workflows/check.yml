name: Repository integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/check_repository.py
      - run: python tests/test_eval_reference_inputs.py
      - run: python tests/test_html_scripts_candidate.py
      - run: python tests/test_trial_package.py
      - run: python commercial/revenue_model.py
